<style>

  html,body{margin:0;width:100%;height:100%;background:#050711;font-family:Impact,'Arial Narrow',system-ui,sans-serif;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 12%,#25264b 0,#0c1022 48%,#03040a 100%)}
  #gameWrap{position:relative;width:min(100vw,160dvh);max-width:1280px;aspect-ratio:16/10;max-height:100dvh;box-shadow:0 0 60px #000;border:1px solid #3c4164;background:#070a14;overflow:hidden;flex:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  #gameWrap:fullscreen,#gameWrap:-webkit-full-screen{width:100vw;height:100dvh;max-width:none;max-height:none;aspect-ratio:auto;border:0;box-shadow:none;background:#070a14}
  #gameWrap:fullscreen canvas,#gameWrap:-webkit-full-screen canvas{width:100%;height:100%}
  .corner{display:none;position:absolute;bottom:8px;right:12px;color:#8b91ad;font:10px Arial,sans-serif;letter-spacing:1px;pointer-events:none;text-shadow:0 1px 4px black}
  /* Landscape on phones fills the entire screen so the touch controls are easier to reach. */
  @media (orientation:landscape){
    body.touch-device #gameWrap{width:100vw;height:100dvh;max-width:none;max-height:none;aspect-ratio:auto;border:0;box-shadow:none}
  }
  @media (orientation:landscape) and (pointer:coarse){
    #gameWrap{width:100vw;height:100dvh;max-width:none;max-height:none;aspect-ratio:auto;border:0;box-shadow:none}
    .corner{display:none}
  }
  /* The game's ring and touch buttons are designed for landscape. Keep their proportions intact in portrait. */
  @media (orientation:portrait){
    body.touch-device #gameWrap{width:min(100vw,160dvh);aspect-ratio:16/10;max-height:none;border:0;box-shadow:none}
    body.touch-device #rotateNotice{display:flex}
  }
  @media (orientation:portrait) and (pointer:coarse){
    #gameWrap{width:min(100vw,160dvh);aspect-ratio:16/10;max-height:none;border:0;box-shadow:none}
    #rotateNotice{display:flex}
  }
  #rotateNotice{display:none;position:fixed;inset:0;z-index:99;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 15%,#283056 0,#101426 52%,#050711 100%);text-align:center}
  .rotate-card{width:min(92vw,440px);padding:26px 24px;border:1px solid #526085;border-radius:22px;background:rgba(8,12,27,.95);box-shadow:0 18px 70px #0009}
  .rotate-symbol{font:64px/1 system-ui,sans-serif;color:#ffce55;margin-bottom:14px}
  .rotate-card h1{margin:0 0 12px;font:900 clamp(25px,7vw,36px)/1.05 Impact,'Arial Narrow',sans-serif;letter-spacing:1px}
  .rotate-card p{margin:0;color:#cdd5ef;font:16px/1.5 system-ui,sans-serif}
  .rotate-card small{display:block;margin-top:18px;color:#8d9abd;font:12px/1.45 system-ui,sans-serif}
</style>

function updateHealthDisplay(f,dt){
 if(!f)return;const actual=clamp(f.hp,0,300);
 if(f.lastHealthSeen===undefined)f.lastHealthSeen=actual;
 if(actual<f.lastHealthSeen-.05)f.healthFlash=18;
 f.lastHealthSeen=actual;
 const displayed=f.displayHp===undefined?actual:f.displayHp;
 f.displayHp=displayed+(actual-displayed)*(1-Math.pow(.925,dt));
 if(Math.abs(f.displayHp-actual)<.25)f.displayHp=actual;
 f.healthFlash=Math.max(0,(f.healthFlash||0)-dt);
}

 ctx.save();ctx.translate(x,y);const s=active?.74:.68;ctx.scale(s,s);if(info.gender==='women')ctx.scale(.90,1);
 const swing=Math.sin(frame*.055+(info.hairStyle||0))*(active?5:2.5),skin=info.skin,gear=info.gear,trim=info.trim;
 ctx.fillStyle='rgba(0,0,0,.34)';ctx.beginPath();ctx.ellipse(0,47,25,5,0,0,Math.PI*2);ctx.fill();

 // boots and legs
 limb(-7,7,-11,25+swing*.25,9,gear);limb(-11,25+swing*.25,-13,43,7,'#181b25');limb(7,7,10,25-swing*.25,9,gear);limb(10,25-swing*.25,12,43,7,'#181b25');
 ctx.fillStyle='#10131d';ctx.beginPath();ctx.roundRect(-21,40+swing*.1,13,7,3);ctx.roundRect(5,40-swing*.1,13,7,3);ctx.fill();ctx.fillStyle=trim;ctx.fillRect(-20,41,8,2);ctx.fillRect(6,41,8,2);
 // athletic torso / gear
 ctx.fillStyle=skin;ctx.beginPath();ctx.moveTo(-12,-27);ctx.quadraticCurveTo(-19,-25,-18,-13);ctx.lineTo(-14,7);ctx.quadraticCurveTo(0,12,14,7);ctx.lineTo(18,-13);ctx.quadraticCurveTo(19,-25,12,-27);ctx.closePath();ctx.fill();
 ctx.fillStyle=gear;ctx.beginPath();ctx.moveTo(-13,-26);ctx.lineTo(13,-26);ctx.lineTo(15,-3);ctx.lineTo(11,8);ctx.lineTo(-11,8);ctx.lineTo(-15,-3);ctx.closePath();ctx.fill();
 ctx.fillStyle=trim;switch((info.gearStyle||0)%5){case 0:ctx.fillRect(-13,-18,26,3);ctx.fillRect(-11,-9,22,3);break;case 1:ctx.beginPath();ctx.moveTo(-12,-24);ctx.lineTo(12,5);ctx.lineTo(7,5);ctx.lineTo(-12,-18);ctx.fill();break;case 2:ctx.fillRect(-3,-25,6,31);break;case 3:ctx.beginPath();ctx.moveTo(-14,-24);ctx.lineTo(0,-10);ctx.lineTo(14,-24);ctx.lineTo(10,-25);ctx.lineTo(0,-16);ctx.lineTo(-10,-25);ctx.fill();break;default:ctx.fillRect(-10,-20,20,4);ctx.fillRect(-7,-10,14,4)}
 ctx.fillStyle=gear;ctx.beginPath();ctx.moveTo(-13,5);ctx.lineTo(13,5);ctx.lineTo(11,17);ctx.lineTo(-11,17);ctx.closePath();ctx.fill();ctx.fillStyle=trim;ctx.fillRect(-12,7,24,3);

// If a key is held, only trigger attacks once per keydown to prevent rapid accidental repeats.
window.addEventListener('keydown',e=>{if(e.repeat&&['KeyJ','KeyK','KeyE','KeyP','KeyH','KeyG'].includes(e.code))e.preventDefault()});
// Accessible quick restart and browser sound start.
window.addEventListener('blur',()=>{keys={};releaseVirtualKeys()});
window.addEventListener('gamepadconnected',()=>setNotice('USB CONTROLLER CONNECTED!',80));
requestAnimationFrame(tick);
